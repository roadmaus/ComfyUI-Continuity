[project]
name = "continuity"
version = "3.2.0"
description = "One node for AI video and stills across seven model families: MiniMax H3, LTX 2.5, Krea 2, Ideogram 4.0, Qwen Image Edit, Flux 2 Klein and Qwen Image 2.1. Write a prompt, attach media with @, press Render. Everything renders locally from open weights. The optional prompt refiner can run in-process or on your own server or API provider."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

