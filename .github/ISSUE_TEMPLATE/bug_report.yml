name: Bug report
description: Something broke — a render fails, the UI misbehaves, a refusal you don't understand.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Two things before you start:
        - If the node **refused** your render with a message naming a field and a folder, that is usually a missing weight file, not a bug — check the model tables in docs/models.md first.
        - Please fill in the environment section even if it feels irrelevant. Most reports we can't act on are missing exactly that.

  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      description: Pick the part of the pack that misbehaves.
      options:
        - Creator node — sampling / render fails or output is wrong
        - Creator node — UI (pills, prompt box, chips, badge)
        - "@ mention menu / attachment picker / Gallery"
        - Trimming / segment editor
        - LoRA manager (cards, metadata, triggers, turbo)
        - Refine (prompt rewriting)
        - PreStage (Krea 2 / Ideogram / H3 stills)
        - Timeline
        - GGUF loading
        - Install / node doesn't load at all
        - Something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead? If there was an error message or a refusal, paste its exact text.
      placeholder: |
        1. Attached @img-1, typed "...", pressed Run
        2. Expected a clip
        3. Got: "..."
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: ComfyUI console output
      description: The terminal output around the failure — the full traceback if there is one. For UI problems, also open the browser DevTools console (F12) and paste any errors from there.
      render: text

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        ComfyUI version is in the terminal at startup or in Manager. The node version is in `pyproject.toml`, or run `git log -1 --oneline` in the node's folder.
      value: |
        - ComfyUI version / commit:
        - Continuity version / commit:
        - Installed via: (git clone / ComfyUI Manager / registry)
        - OS:
        - GPU + VRAM:
        - Model family: (MiniMax H3 / LTX 2.5 / Krea 2 / Ideogram 4.0)
    validations:
      required: true

  - type: textarea
    id: weights
    attributes:
      label: Model files (render/sampling bugs only)
      description: What the weights pill was set to when it failed. Filenames are enough — they tell us quantization, variant and source. Skip for pure UI bugs.
      value: |
        - Checkpoint (FL2VA / Ref2VA):
        - Text encoder:
        - VAE(s):
        - GGUF involved? ComfyUI-GGUF installed?:
        - LoRAs / turbo on?:
        - Refiner model (if Refine is involved):

  - type: textarea
    id: workflow
    attributes:
      label: Workflow / prompt
      description: Drag the workflow JSON here (export via Workflow → Export), or paste the prompt and describe what was attached (how many images/videos/audio, scopes, trims). This lets us reproduce instead of guess.

  - type: dropdown
    id: locale
    attributes:
      label: UI language
      description: Only matters for UI/text bugs.
      options:
        - English
        - 日本語
        - 한국어
        - 中文
